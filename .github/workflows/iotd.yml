name: IOTD
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Runs the workflow once every day at 02:25 UTC
    - cron: "25 2 * * *"

env:
  PAGE_BRANCH: "gh-pages"

jobs:
  generate_new_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: rsb-23/actions/checkout@main
        with:
          persist-credentials: true

      - name: Set up Python
        uses: rsb-23/actions/setup-python@main
        with:
          python-version: 3.12

      - name: Get data.json
        shell: bash
        run: |
          git fetch origin "$PAGE_BRANCH:$PAGE_BRANCH" --depth=1
          git checkout "$PAGE_BRANCH" -- iotd/data.json

      - name: Generates image
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SAVE_RESPONSE: False
        run: |
          python -m pip install --upgrade pip
          pip install .
          python painter.py
        shell: bash

      - name: Copy changes to ${{ env.PAGE_BRANCH }} branch
        shell: bash
        run: |
          TMP=$(mktemp -d)
          cp -r iotd/ "$TMP"
          git checkout "$PAGE_BRANCH"
          cp -r "${TMP}/iotd/" .
          rm -rf "$TMP"

      - name: Commit and push changes
        uses: rsb-23/actions/commit-n-push@main
        with:
          git_user: "painter[bot]"
          files: "iotd/"
          commit_message: "New images generated"
